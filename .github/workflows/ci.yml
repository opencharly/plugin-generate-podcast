name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt/vet/test
        working-directory: candy/plugin-generate-podcast
        run: |
          gofmt -l . | grep -v '^$' && exit 1 || true
          go vet ./...
          go test ./...
      - name: Install cue (pinned)
        run: go install cuelang.org/go/cmd/cue@v0.16.1
      - name: Generated params are reproducible (cue:gen)
        run: |
          rm -rf /tmp/cuegenpkg && mkdir -p /tmp/cuegenpkg
          # The ONE generation recipe: ALL FOUR schema files, one package. Two measured traps:
          #   * only desk.cue reproduces nothing -- the committed file carries Source/SourceBundle/
          #     Episode/RenderManifest too, so a one-file recipe cannot match it;
          #   * each schema file opens with `package podcast` and one CUE package per directory is the
          #     rule, so the lines are STRIPPED before concatenation (the target package is `params`).
          echo 'package params' > /tmp/cuegenpkg/schema.cue
          for f in desk source episode manifest; do
            grep -v '^package ' "candy/plugin-generate-podcast/schema/$f.cue" >> /tmp/cuegenpkg/schema.cue
          done
          cd /tmp/cuegenpkg && cue exp gengotypes .
          diff <(sed '1,1d' /tmp/cuegenpkg/cue_types_params_gen.go) \
               <(sed '1,1d' "$GITHUB_WORKSPACE/candy/plugin-generate-podcast/params/cue_types_gen.go")
